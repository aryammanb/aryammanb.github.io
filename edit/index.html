<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src https://aryamman-portfolio-content-api.aryammanbhatia.chatgpt.site; style-src 'self' 'unsafe-inline'; img-src 'self' https://aryamman-portfolio-content-api.aryammanbhatia.chatgpt.site; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Edit Aryamman Bhatia’s portfolio</title>
<link rel="stylesheet" href="/assets/portfolio.css?v=4">
<link rel="stylesheet" href="/assets/quill.bubble.css">
<link rel="stylesheet" href="/assets/portfolio-editor.css?v=4">
<script src="/assets/purify.min.js" defer></script>
<script src="/assets/quill.js" defer></script>
<script src="/assets/portfolio-shared.js?v=4" defer></script>
<script src="/assets/portfolio-editor.js?v=4" defer></script>
</head>
<body>
<main id="unlock-panel">
  <h1>Aryamman Bhatia</h1>
  <p>Portfolio editor</p>
  <form id="unlock-form">
    <label for="pin">Enter your PIN</label>
    <div class="unlock-controls"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required aria-describedby="unlock-error"><button id="unlock-button" type="submit">Unlock</button></div>
    <p id="unlock-error" role="alert"></p>
  </form>
  <p><a href="https://aryammanb.github.io/">View the portfolio</a></p>
</main>
<div id="editor-panel" hidden>
  <div class="editor-bar"><button id="save-button" type="button">Save changes</button><span id="save-status" role="status" aria-live="polite"></span><button id="logout-button" type="button">Lock</button><a href="https://aryammanb.github.io/" target="_blank" rel="noopener">View site</a></div>
  <div class="page-controls"><label for="page-select">Page</label><select id="page-select"><option value="">Homepage</option></select><button id="add-page" type="button">Add page</button><button id="add-image" type="button">Add image</button><a id="view-page" href="/" target="_blank" rel="noopener">View page</a></div>
  <form id="add-page-form" hidden><label for="new-page-title">Page title</label><input id="new-page-title" maxlength="100" required><button type="submit">Create page</button><button id="cancel-page" type="button">Cancel</button><p class="editor-note">A link will be added to your homepage. Save changes publishes the new page.</p></form>
  <form id="image-form" hidden>
    <label for="image-file">Choose an image (PNG, JPEG, WebP, GIF or AVIF; up to 5 MB)</label>
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,.avif" required>
    <label for="image-alt">Image description (optional, for accessibility)</label>
    <input id="image-alt" type="text" maxlength="500">
    <button id="insert-image" type="submit">Insert image</button><button id="cancel-image" type="button">Cancel</button>
    <p id="image-status" role="status" aria-live="polite"></p>
  </form>
  <main>
    <h1 id="site-title" contenteditable="plaintext-only" role="textbox" aria-label="Page title"></h1>
    <div id="body-editor"></div>
    <p class="editor-note">Click text to edit. Select text for formatting and links. Save changes publishes to your portfolio.</p>
  </main>
</div>
<noscript>Enable JavaScript to use the editor.</noscript>
</body>
</html>
